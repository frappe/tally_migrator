[project]
name = "tally_migrator"
version = "1.0.0"
authors = [{ name = "Frappe Technologies Pvt. Ltd.", email = "developers@frappe.io" }]
description = "Migrate masters and transactions from Tally to ERPNext"
requires-python = ">=3.10"
readme = "README.md"
# frappe and erpnext are bench apps, NOT PyPI packages — never list them here.
dependencies = []

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tally_migrator*"]

# Frappe Cloud reads this to validate version compatibility during installs,
# updates, and branch changes. Use version ranges, not hard pins.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
